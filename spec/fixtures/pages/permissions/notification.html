<script>
var n1 = new Notification('Neutron Notification.requestPermission test 1')
var n2 = new Notification('Neutron Notification.requestPermission test 2')
Notification.requestPermission().then((result) => {
  n1.close()
  n2.close()

  require('neutron').ipcRenderer.send('message', result)
})
</script>
